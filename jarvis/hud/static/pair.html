<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pair with JARVIS</title>
  <link rel="stylesheet" href="/static/hud.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body data-state="idle" class="pair-page">
  <div class="grid-bg" aria-hidden="true"></div>
  <main class="pair">
    <div class="pair-card">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">J.A.R.V.I.S.</span></div>
      <h1>Pair this phone</h1>
      <p class="pair-sub">Type the 6-digit code shown in the JARVIS window on your computer, or scan the QR code there with your camera.</p>
      <form method="post" action="/pair" class="pair-form" autocomplete="off">
        <label for="code" class="pair-label">Pairing code</label>
        <input id="code" name="code" class="pair-code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9 ]{6,7}" maxlength="7" placeholder="123456" required autofocus>
        <p class="pair-error" role="alert">__ERROR__</p>
        <button class="solid" type="submit">Pair</button>
      </form>
      <p class="pair-sub small">Only devices you pair can use JARVIS. This phone stays paired for 30 days.</p>
    </div>
  </main>
</body>
</html>
