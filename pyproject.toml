[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS: a personal assistant powered by Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
